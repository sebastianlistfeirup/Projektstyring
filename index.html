<!doctype html>
<html lang="da" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='24' fill='%236366f1'/%3E%3Cellipse cx='50' cy='50' rx='44' ry='15' fill='none' stroke='%23818cf8' stroke-width='7' transform='rotate(-24 50 50)'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Orbit – moderne projektstyring til dit team" />
    <title>Orbit – Projektstyring</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('orbit-store-v1');
          var theme = raw ? JSON.parse(raw).state.theme : 'dark';
          document.documentElement.classList.toggle('dark', theme !== 'light');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
